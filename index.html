<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#222222" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Сапер</title>
    <style>
      body {
        font-family: sans-serif;
        background: #222;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 12px;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .box {
        background: #111;
        padding: 4px 10px;
        border-radius: 4px;
        font: bold 20px monospace;
        min-width: 70px;
        text-align: center;
      }
      select,
      button {
        font-size: 16px;
        padding: 4px 10px;
      }
      #wrap {
        max-width: 100%;
        overflow: auto;
      }
      canvas {
        display: block;
        touch-action: manipulation;
      }
      #status {
        margin-top: 8px;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <select id="level">
        <option value="easy">Новачок 9×9, 10 мін</option>
        <option value="medium">Аматор 16×16, 40 мін</option>
        <option value="hard">Профі 30×16, 99 мін</option>
      </select>
      <span class="box" id="mines">💣 000</span>
      <button id="restart">🙂 Заново</button>
      <button id="mute" title="Звук">🔊</button>
      <span class="box" id="timer">⏱ 000</span>
    </div>
    <div id="wrap"><canvas id="c"></canvas></div>
    <div id="status"></div>

    <script type="module">
      const sfx = (() => {
        let ctx = null,
          muted = false;
        try {
          muted = localStorage.getItem('ms-muted') === '1';
        } catch {}

        function ac() {
          if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            ctx = new AC();
          }
          if (ctx.state === 'suspended') ctx.resume();
          return ctx;
        }

        function tone({
          freq,
          to,
          dur = 0.1,
          type = 'sine',
          vol = 0.2,
          delay = 0
        }) {
          const c = ac();
          if (!c || muted) return;
          const t = c.currentTime + delay;
          const o = c.createOscillator(),
            g = c.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, t);
          if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(c.destination);
          o.start(t);
          o.stop(t + dur + 0.02);
        }

        function noise({ dur = 0.7, vol = 0.5, from = 2500, to = 60 }) {
          const c = ac();
          if (!c || muted) return;
          const t = c.currentTime;
          const buf = c.createBuffer(
            1,
            Math.floor(c.sampleRate * dur),
            c.sampleRate
          );
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++)
            data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
          const src = c.createBufferSource();
          src.buffer = buf;
          const f = c.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.setValueAtTime(from, t);
          f.frequency.exponentialRampToValueAtTime(to, t + dur);
          const g = c.createGain();
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f).connect(g).connect(c.destination);
          src.start(t);
        }

        return {
          unlock() {
            ac();
          },
          isMuted() {
            return muted;
          },
          toggleMute() {
            muted = !muted;
            try {
              localStorage.setItem('ms-muted', muted ? '1' : '0');
            } catch {}
            if (!muted) tone({ freq: 660, dur: 0.08, vol: 0.15 });
            return muted;
          },

          reveal(n) {
            tone({ freq: 520, dur: 0.06, type: 'triangle', vol: 0.15 });
            if (n > 1) {
              const steps = Math.min(6, Math.ceil(Math.log2(n)) + 1);
              for (let i = 1; i <= steps; i++)
                tone({
                  freq: 520 * Math.pow(1.12, i),
                  dur: 0.05,
                  type: 'triangle',
                  vol: 0.1,
                  delay: i * 0.04
                });
            }
          },
          chord() {
            tone({ freq: 440, dur: 0.07, type: 'triangle', vol: 0.15 });
            tone({
              freq: 660,
              dur: 0.09,
              type: 'triangle',
              vol: 0.15,
              delay: 0.05
            });
          },
          flag() {
            tone({ freq: 740, dur: 0.05, type: 'square', vol: 0.08 });
            tone({
              freq: 988,
              dur: 0.07,
              type: 'square',
              vol: 0.08,
              delay: 0.05
            });
          },
          unflag() {
            tone({ freq: 600, to: 380, dur: 0.1, type: 'square', vol: 0.07 });
          },
          boom() {
            noise({});
            tone({ freq: 160, to: 35, dur: 0.6, type: 'sawtooth', vol: 0.35 });
            if (navigator.vibrate) navigator.vibrate([80, 40, 160]);
          },
          win() {
            [523, 659, 784, 1047].forEach((f, i) =>
              tone({
                freq: f,
                dur: 0.18,
                type: 'triangle',
                vol: 0.18,
                delay: i * 0.12
              })
            );
            tone({
              freq: 1047,
              dur: 0.5,
              type: 'triangle',
              vol: 0.15,
              delay: 0.5
            });
          }
        };
      })();

      window.addEventListener('pointerdown', () => sfx.unlock(), {
        once: true
      });

      const muteBtn = document.getElementById('mute');
      muteBtn.textContent = sfx.isMuted() ? '🔇' : '🔊';
      muteBtn.addEventListener('click', () => {
        muteBtn.textContent = sfx.toggleMute() ? '🔇' : '🔊';
      });

      import init, { Minesweeper, GameStatus } from './pkg/minesweeper.js';

      if ('serviceWorker' in navigator)
        navigator.serviceWorker.register('./sw.js');

      await init();

      const LEVELS = {
        easy: { w: 9, h: 9, m: 10 },
        medium: { w: 16, h: 16, m: 40 },
        hard: { w: 30, h: 16, m: 99 }
      };
      const COLORS = [
        '',
        '#00f',
        '#080',
        '#f00',
        '#008',
        '#800',
        '#088',
        '#000',
        '#888'
      ];

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const levelSel = document.getElementById('level');
      const minesEl = document.getElementById('mines');
      const timerEl = document.getElementById('timer');
      const statusEl = document.getElementById('status');

      let game = null,
        W,
        H,
        SIZE,
        level;

      let timerId = null,
        startTime = 0,
        elapsed = 0;

      function pad(n) {
        return String(Math.min(999, Math.floor(n))).padStart(3, '0');
      }

      function tick() {
        if (timerId !== null) elapsed = (performance.now() - startTime) / 1000;
        timerEl.textContent = '⏱ ' + pad(elapsed);
      }

      function stopTimer() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function resetTimer() {
        stopTimer();
        elapsed = 0;
        tick();
      }

      function getBest() {
        try {
          return parseFloat(localStorage.getItem('ms-best-' + level));
        } catch {
          return NaN;
        }
      }
      function saveBest(t) {
        try {
          localStorage.setItem('ms-best-' + level, String(t));
        } catch {}
      }

      function layout() {
        SIZE = Math.max(
          20,
          Math.min(32, Math.floor((window.innerWidth - 24) / W))
        );
        const dpr = window.devicePixelRatio || 1;

        canvas.width = Math.round(W * SIZE * dpr);
        canvas.height = Math.round(H * SIZE * dpr);
        canvas.style.width = W * SIZE + 'px';
        canvas.style.height = H * SIZE + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function newGame() {
        if (game) game.free();
        level = levelSel.value;
        const L = LEVELS[level];
        W = L.w;
        H = L.h;
        game = new Minesweeper(W, H, L.m, Date.now() >>> 0);

        layout();

        resetTimer();
        sync();
        try {
          localStorage.setItem('ms-level', level);
        } catch {}
      }

      function sync() {
        const st = game.status();

        if (st === GameStatus.Playing && timerId === null) {
          startTime = performance.now();
          timerId = setInterval(tick, 100);
        }

        let msg = '';
        if (st === GameStatus.Won || st === GameStatus.Lost) {
          if (timerId !== null) {
            elapsed = (performance.now() - startTime) / 1000;
            stopTimer();
            if (st === GameStatus.Won) {
              const best = getBest();
              if (isNaN(best) || elapsed < best) {
                saveBest(elapsed);
                msg = `🎉 Перемога за ${elapsed.toFixed(1)} с. Новий рекорд!`;
              } else {
                msg = `🎉 Перемога за ${elapsed.toFixed(1)} с. Рекорд: ${best.toFixed(1)} с`;
              }
            } else {
              msg = '💥 Програш';
            }
            statusEl.textContent = msg;
          }
        } else {
          const best = getBest();
          statusEl.textContent = isNaN(best)
            ? ''
            : `Рекорд: ${best.toFixed(1)} с`;
        }

        const left = game.mines_left();
        minesEl.textContent =
          '💣 ' +
          (left < 0
            ? '-' + String(-left).padStart(2, '0')
            : String(left).padStart(3, '0'));
        tick();
        draw();
      }

      function draw() {
        const view = game.view();
        ctx.font = `bold ${Math.floor(SIZE * 0.65)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const v = view[y * W + x];
            const px = x * SIZE,
              py = y * SIZE;

            ctx.fillStyle = v <= 8 ? '#ddd' : '#999';
            if (v === 12) ctx.fillStyle = '#f66';
            ctx.fillRect(px, py, SIZE - 1, SIZE - 1);

            let text = '',
              color = '#000';
            if (v >= 1 && v <= 8) {
              text = v;
              color = COLORS[v];
            } else if (v === 10) text = '🚩';
            else if (v === 11 || v === 12) text = '💣';
            else if (v === 13) text = '❌';

            if (text !== '') {
              ctx.fillStyle = color;
              ctx.fillText(text, px + SIZE / 2, py + SIZE / 2 + 1);
            }
          }
        }
      }

      function cellFromEvent(e) {
        const r = canvas.getBoundingClientRect();
        return [
          Math.floor(((e.clientX - r.left) / r.width) * W),
          Math.floor(((e.clientY - r.top) / r.height) * H)
        ];
      }

      function act(kind, fn) {
        const before = game.status();
        const opened = fn();
        sync();
        const after = game.status();

        if (after === GameStatus.Lost && before !== GameStatus.Lost) sfx.boom();
        else if (after === GameStatus.Won && before !== GameStatus.Won)
          sfx.win();
        else if (opened > 0) {
          if (kind === 'chord') sfx.chord();
          else sfx.reveal(opened);
        }
      }

      function flag(x, y) {
        if (!game.toggle_flag(x, y)) return;
        if (game.cell(x, y) === 10) sfx.flag();
        else sfx.unflag();
        sync();
      }

      canvas.addEventListener('click', (e) => {
        const [x, y] = cellFromEvent(e);
        const v = game.cell(x, y);
        if (v >= 1 && v <= 8) act('chord', () => game.chord(x, y));
        else act('reveal', () => game.reveal(x, y));
      });

      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const [x, y] = cellFromEvent(e);
        flag(x, y);
      });

      let pressTimer = null,
        longPressed = false;

      canvas.addEventListener(
        'touchstart',
        (e) => {
          longPressed = false;
          const [x, y] = cellFromEvent(e.touches[0]);
          pressTimer = setTimeout(() => {
            longPressed = true;
            if (navigator.vibrate) navigator.vibrate(30);
            flag(x, y);
          }, 400);
        },
        { passive: true }
      );

      canvas.addEventListener('touchend', (e) => {
        clearTimeout(pressTimer);
        if (longPressed) e.preventDefault();
      });

      canvas.addEventListener('touchmove', () => clearTimeout(pressTimer), {
        passive: true
      });

      levelSel.addEventListener('change', newGame);
      document.getElementById('restart').addEventListener('click', newGame);

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!game) return;
          layout();
          draw();
        }, 100);
      });

      try {
        const saved = localStorage.getItem('ms-level');
        if (saved && LEVELS[saved]) levelSel.value = saved;
      } catch {}
      newGame();
    </script>
  </body>
</html>
